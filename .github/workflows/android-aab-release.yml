name: AAB (Play Store - imzali derleme)

# Elle tetiklenir: GitHub -> Actions -> "AAB (Play Store - imzali derleme)" -> Run workflow -> dal secilir
# (varsayilan dal: apk). Kod TETIKLENEN daldan alinir; kalite kapisi gecmeden AAB derlenmez.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kalite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Kalite kapisi (tsc + 300-hayat smoke + eski kayit gocu) — kirik mantik Play'e binmesin
        working-directory: mobile
        run: |
          npx tsc --noEmit
          node scripts/_smoke/kurtarma-check.cjs
          node scripts/_smoke/ses-check.cjs
          node scripts/_smoke/kayit-check.cjs
          node scripts/_smoke/emek-check.cjs
          node scripts/_smoke/hafiza-check.cjs
          node scripts/_smoke/soylenti-check.cjs
          node scripts/_smoke/gdd-baseline.cjs
          npx --no-install esbuild lib/game.ts --bundle --platform=node --format=cjs --outfile=/tmp/kronikler-game-bundle.cjs --log-level=error
          node scripts/_smoke/run.cjs
          node scripts/_smoke/migrate-check.cjs

  build:
    runs-on: ubuntu-latest
    needs: [kalite]   # kalite kapisi gecmeden AAB derlenmez
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Surum (tek kaynak mobile/app.json; prebuild build.gradle'a aynen yazar — ezilmez)
        working-directory: mobile
        run: |
          node scripts/surum-artir.cjs --goster
          BEKLENEN=$(node -p "require('./app.json').expo.android.versionCode")
          grep -q "versionCode $BEKLENEN" android/app/build.gradle || { echo "::error::build.gradle versionCode app.json ile uyusmuyor"; exit 1; }

      - name: Keystore'u geri yukle
        # Secret adlari APK workflow'uyla AYNI. KEY_ALIAS bossa 'kronikler', KEY_PASSWORD bossa KEYSTORE_PASSWORD.
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::AAB imzasiz yuklenemez: KEYSTORE_BASE64 ve KEYSTORE_PASSWORD secret'lari gerekli (bkz. mobile/YAYIN.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > kronikler.keystore

      - name: Gradle bundleRelease (imzali AAB)
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_ALIAS="${KEY_ALIAS:-kronikler}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/kronikler.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon --stacktrace
          rm -f kronikler.keystore

      - name: AAB'yi yeniden adlandir
        run: cp mobile/android/app/build/outputs/bundle/release/app-release.aab Kronikler.aab

      - name: Artefakt (yedek indirme)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-aab
          path: Kronikler.aab

      - name: Release'e yukle (dogrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-latest
          name: Kronikler - guncel AAB (Play Store)
          files: Kronikler.aab
