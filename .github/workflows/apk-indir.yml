name: APK indirme sayfasi (herkese acik)

# GitHub Release'teki APK'yı herkese açık kronikler-indir Worker'ına koyar (depo özel olduğu için).
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Kaynak Release etiketi"
        type: choice
        options: [apk-test, apk-latest]
        default: apk-test

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: online-server/package-lock.json
      - name: Wrangler
        working-directory: online-server
        run: npm ci --no-audit --no-fund
      - name: APK'yi indir ve parcala
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.surum }}" -p Kronikler.apk -D "$RUNNER_TEMP"
          mkdir -p tools/apk-indir/public/parca
          cd tools/apk-indir/public/parca
          split -b 20m -d -a 2 --additional-suffix=.bin "$RUNNER_TEMP/Kronikler.apk" ""
          boyut=$(stat -c %s "$RUNNER_TEMP/Kronikler.apk")
          node -e 'const fs=require("fs");const p=fs.readdirSync(".").filter(f=>f.endsWith(".bin")).sort();fs.writeFileSync("liste.json",JSON.stringify({boyut:Number(process.argv[1]),parcalar:p}))' "$boyut"
          cat liste.json
      - name: Worker'i dagit
        working-directory: tools/apk-indir
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../../online-server/node_modules/.bin/wrangler deploy
      - name: Indirmeyi dogrula (tam dosya ve ozet)
        run: |
          beklenen=$(sha256sum "$RUNNER_TEMP/Kronikler.apk" | cut -c1-64)
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 300 -o "$RUNNER_TEMP/inen.apk" https://kronikler-indir.berkaycinkilic.workers.dev/Kronikler.apk; then break; fi
            sleep 10
          done
          inen=$(sha256sum "$RUNNER_TEMP/inen.apk" | cut -c1-64)
          echo "beklenen $beklenen"; echo "inen     $inen"
          test "$beklenen" = "$inen"
          curl -fsS -m 30 https://kronikler-indir.berkaycinkilic.workers.dev/ | grep -q "APK'yı indir"
