name: APK (yerel derleme - hesapsiz)

# Elle tetiklenir: GitHub -> Actions -> "APK (yerel derleme - hesapsiz)" -> Run workflow -> dal: apk
# EXPO_TOKEN / Expo hesabi GEREKMEZ. GitHub runner'inda expo prebuild + gradle ile derler,
# APK'yi indirilebilir artefakt olarak yukler (run sayfasi altinda "kronikler-apk").
# Hiz: npm + Gradle onbellekli; kalite kapisi (tsc + smoke) DERLEMEYLE PARALEL kosar,
# yayin adimi ikisini de bekler — sure toplam degil, en uzun bacak kadar.
on:
  workflow_dispatch:
    inputs:
      kisa_kontrol:
        description: "Uzun smoke yerine tip ve hedefli savaş/kayıt/dil kontrolleri"
        type: boolean
        default: false
      kanal:
        description: "latest = kalici link (apk-latest) · test = ayri deneme linki (apk-test), kalici linke dokunmaz"
        type: choice
        options: [latest, test]
        default: latest

jobs:
  kalite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Kalite kapisi
        working-directory: mobile
        env:
          KISA_KONTROL: ${{ inputs.kisa_kontrol }}
        run: |
          if [ "$KISA_KONTROL" = "true" ]; then
            set -e
            npx tsc --noEmit
            npx --no-install esbuild lib/game.ts --bundle --platform=node --format=cjs --outfile=/tmp/kronikler-game-bundle.cjs --log-level=error
            node scripts/check-war.cjs
            node scripts/check-army.cjs
            node scripts/_smoke/migrate-check.cjs
            node scripts/_smoke/i18n-icon-check.cjs
            node scripts/_smoke/dil-karisma.cjs
            exit 0
          fi
          npx tsc --noEmit
          node scripts/_smoke/kurtarma-check.cjs
          node scripts/_smoke/ses-check.cjs
          node scripts/_smoke/kayit-check.cjs
          node scripts/_smoke/rng-yol-ticaret-savas-check.cjs
          node scripts/_smoke/emek-check.cjs
          node scripts/_smoke/hafiza-check.cjs
          node scripts/_smoke/soylenti-check.cjs
          node scripts/_smoke/sahit-check.cjs
          node scripts/_smoke/echo-check.cjs
          node scripts/_smoke/karsi-soz-check.cjs
          node scripts/_smoke/bakis-check.cjs
          node scripts/_smoke/izlenim-check.cjs
          node scripts/_smoke/sohbet-check.cjs
          node scripts/_smoke/torun-check.cjs
          node scripts/_smoke/evlat-check.cjs
          node scripts/_smoke/varis-check.cjs
          node scripts/_smoke/gdd-baseline.cjs
          npx --no-install esbuild lib/game.ts --bundle --platform=node --format=cjs --outfile=/tmp/kronikler-game-bundle.cjs --log-level=error
          node scripts/_smoke/run.cjs
          node scripts/_smoke/migrate-check.cjs

  derle:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle onbellegi (bagimliliklar + wrapper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Surum (tek kaynak mobile/app.json — ezilmez; artirmak icin scripts/surum-artir.cjs)
        working-directory: mobile
        run: node scripts/surum-artir.cjs --goster
      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Gradle assembleRelease (arm64-v8a) — JS paketi gomulu, tek basina calisir
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: APK'yi temiz isimle kopyala
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Kronikler.apk
      - name: Kalici imza (KEYSTORE secret'lari varsa; yoksa debug imza aynen kalir)
        # Secret adlari AAB workflow'uyla AYNI: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
        # KEY_ALIAS bossa 'kronikler', KEY_PASSWORD bossa KEYSTORE_PASSWORD kullanilir.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Keystore secret yok - debug imza ile devam (dogrudan dagitim icin yeterli)"; exit 0; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::KEYSTORE_BASE64 var ama KEYSTORE_PASSWORD yok"; exit 1; fi
          export KEY_ALIAS="${KEY_ALIAS:-kronikler}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 Kronikler.apk Kronikler-hizali.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Kronikler-imzali.apk Kronikler-hizali.apk
          mv Kronikler-imzali.apk Kronikler.apk
          rm -f release.keystore Kronikler-hizali.apk
          echo "Kalici imza uygulandi (alias: $KEY_ALIAS)"
      - name: APK'yi yukle (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-apk
          path: Kronikler.apk
          if-no-files-found: error

  yayinla:
    runs-on: ubuntu-latest
    needs: [kalite, derle]   # kalite kapisi gecmeden hicbir APK linke dusmez
    permissions:
      contents: write   # apk-latest Release olusturmak/guncellemek icin
    steps:
      - name: APK artefaktini indir
        uses: actions/download-artifact@v4
        with:
          name: kronikler-apk
      - name: Release'e yukle (dogrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.kanal == 'test' && 'apk-test' || 'apk-latest' }}"
          name: "${{ inputs.kanal == 'test' && 'Kronikler APK (test)' || 'Kronikler APK (guncel)' }}"
          prerelease: "${{ inputs.kanal == 'test' }}"
          body: "${{ inputs.kanal == 'test' && 'Deneme derlemesi - kalici linkten ayri. Dogrudan indirme: Kronikler.apk' || 'En guncel derleme. Dogrudan indirme: Kronikler.apk (girissiz, herkese acik).' }}"
          files: Kronikler.apk
          fail_on_unmatched_files: true
