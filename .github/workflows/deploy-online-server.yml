# Yalnız elle tetiklenir: çevrimiçi Worker'ı seçilen dalın koduyla dağıtır.
# Üretim hedefi yalnız apk dalından çalışır; Wrangler online-server/package-lock.json ile sabittir.
# apk push'larına bağlanmaz; eski server/ (Diyar MP) dağıtımına dokunmaz.
# Gerekli GitHub Actions secret: CLOUDFLARE_API_TOKEN.
# Worker secrets (OTURUM_ANAHTARI, YONETICI_EPOSTALAR, REALTIME_APP_TOKEN vb.)
# Cloudflare Worker üzerinde önceden tanımlanmalıdır; bu iş akışı bunları okumaz veya yazmaz.
name: Deploy Online Server

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Test Worker (ayrı DO verisi) veya üretim Worker"
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard production branch
        if: inputs.hedef == 'production' && github.ref != 'refs/heads/apk'
        run: |
          echo "::error::Üretim dağıtımı yalnız apk dalından yapılabilir (şu an: ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            online-server/package-lock.json
      - name: Check Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN tanımlı değil."
            exit 1
          fi
      - name: Install TypeScript toolchain
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Install pinned Wrangler
        working-directory: online-server
        run: npm ci --no-audit --no-fund
      - name: Online server tests
        working-directory: online-server
        run: npm test
      - name: Online server typecheck
        working-directory: online-server
        run: npm run typecheck
      - name: Deploy isolated test Worker
        if: inputs.hedef == 'test'
        working-directory: online-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.test.toml | tee "$RUNNER_TEMP/dagitim.txt"
      - name: Deploy production Worker
        if: inputs.hedef == 'production' && github.ref == 'refs/heads/apk'
        working-directory: online-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy | tee "$RUNNER_TEMP/dagitim.txt"
      # Dağıtımdan sonra canlı adres yoklanır: herkese açık /v1/dunya 200 ve beylik listesi dönmeli.
      # Gizli değer ya da oyuncu verisi kullanılmaz; yalnız okuma.
      - name: Canlı sağlık kontrolü
        run: |
          adres=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/dagitim.txt" | head -n1)
          if [ -z "$adres" ]; then echo "::error::Dağıtım çıktısında workers.dev adresi bulunamadı."; exit 1; fi
          echo "Adres: $adres"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "$adres/v1/dunya" | grep -q '"beylikler"'; then echo "Sunucu yanıt veriyor."; exit 0; fi
            sleep 5
          done
          echo "::error::$adres/v1/dunya yanıt vermedi."
          exit 1
