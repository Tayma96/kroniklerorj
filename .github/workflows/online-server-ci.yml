name: Online server CI

on:
  pull_request:
    paths:
      - "online-server/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/app/**"
      - "mobile/components/**"
      - "mobile/lib/**"
      - "mobile/scripts/**"
      - "mobile/tsconfig.json"
      - ".github/workflows/online-server-ci.yml"
      - ".github/workflows/deploy-online-server.yml"
  push:
    branches: [apk]
    paths:
      - "online-server/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/online-server-ci.yml"

permissions:
  contents: read

jobs:
  online-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Mobile TypeScript typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Validate static mobile image assets
        working-directory: mobile
        run: npm run assets:check
      - name: Validate mobile translation keys and icon names
        working-directory: mobile
        run: node scripts/_smoke/i18n-icon-check.cjs
      - name: Validate language isolation
        working-directory: mobile
        run: node scripts/_smoke/dil-karisma.cjs
      - name: Online server tests
        working-directory: online-server
        run: npm test
      - name: Online server typecheck
        working-directory: online-server
        run: npm run typecheck
